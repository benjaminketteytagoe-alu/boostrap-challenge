<!-- SECTION 5: REGISTRATION MODAL (Assigned to benja) -->
<div class="modal fade" id="registerModal" tabindex="-1" aria-labelledby="registerModalLabel" aria-hidden="true">
    <div class="modal-dialog">
        <div class="modal-content">

            <div class="modal-header bg-warning">
                <h5 class="modal-title" id="registerModalLabel">Register for Conference</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>

            <div class="modal-body">
                <div class="alert alert-warning alert-dismissible fade show" role="alert">
                    <strong>Hurry !</strong> Early bird registration ends in two days.
                    <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                </div>

                <form method="dialog">

                    <!-- Basic Info -->
                    <h5 class="mb-3">Basic Info.</h5>

                    <div class="mb-3">
                        <label for="regName" class="form-label">Name:</label>
                        <input type="text" class="form-control" id="regName" name="name" autocomplete="name" required>
                    </div>

                    <div class="mb-3">
                        <label for="regEmail" class="form-label">Email:</label>
                        <input type="email" class="form-control" id="regEmail" name="email" autocomplete="email" required>
                    </div>

                    <div class="mb-3">
                        <label for="regRole" class="form-label">Job Role:</label>
                        <select class="form-select" id="regRole" name="role">
                            <option selected>Full Stack JS Developer</option>
                            <option>Front-End Developer</option>
                            <option>Back-End Developer</option>
                            <option>Student</option>
                            <option>Other</option>
                        </select>
                    </div>

                    <hr>

                    <!-- Topics -->
                    <h5 class="mb-3">Which Topics Interest You Most?</h5>

                    <div class="form-check">
                        <input class="form-check-input" type="checkbox" id="topicFrameworks" name="topics" value="frameworks">
                        <label class="form-check-label" for="topicFrameworks">JavaScript Frameworks</label>
                    </div>
                    <div class="form-check">
                        <input class="form-check-input" type="checkbox" id="topicLibraries" name="topics" value="libraries">
                        <label class="form-check-label" for="topicLibraries">JavaScript Libraries</label>
                    </div>
                    <div class="form-check">
                        <input class="form-check-input" type="checkbox" id="topicNode" name="topics" value="node">
                        <label class="form-check-label" for="topicNode">Node.js</label>
                    </div>
                    <div class="form-check">
                        <input class="form-check-input" type="checkbox" id="topicBuild" name="topics" value="build-tools">
                        <label class="form-check-label" for="topicBuild">Build Tools</label>
                    </div>
                    <div class="form-check">
                        <input class="form-check-input" type="checkbox" id="topicEs2015" name="topics" value="es2015">
                        <label class="form-check-label" for="topicEs2015">ES2015</label>
                    </div>

                    <hr>

                    <!-- Payment -->
                    <h5 class="mb-3">Payment Info.</h5>

                    <div class="row g-3 mb-3">
                        <div class="col-12 col-sm-6">
                            <label for="regCard" class="form-label">Card Number:</label>
                            <input type="text" class="form-control" id="regCard" inputmode="numeric" autocomplete="cc-number" maxlength="19" required>
                        </div>
                        <div class="col-6 col-sm-3">
                            <label for="regZip" class="form-label">Zip Code:</label>
                            <input type="text" class="form-control" id="regZip" autocomplete="postal-code" required>
                        </div>
                        <div class="col-6 col-sm-3">
                            <label for="regCvv" class="form-label">CVV:</label>
                            <input type="text" class="form-control" id="regCvv" inputmode="numeric" autocomplete="cc-csc" maxlength="4" required>
                        </div>
                    </div>

                    <label class="form-label" for="regMonth">Expiration Date:</label>
                    <div class="row g-3 mb-3">
                        <div class="col-6">
                            <select class="form-select" id="regMonth" aria-label="Expiration month">
                                <option selected>1 - January</option>
                                <option>2 - February</option>
                                <option>3 - March</option>
                                <option>4 - April</option>
                                <option>5 - May</option>
                                <option>6 - June</option>
                                <option>7 - July</option>
                                <option>8 - August</option>
                                <option>9 - September</option>
                                <option>10 - October</option>
                                <option>11 - November</option>
                                <option>12 - December</option>
                            </select>
                        </div>
                        <div class="col-6">
                            <select class="form-select" id="regYear" aria-label="Expiration year">
                                <option selected>2026</option>
                                <option>2027</option>
                                <option>2028</option>
                                <option>2029</option>
                                <option>2030</option>
                                <option>2031</option>
                            </select>
                        </div>
                    </div>

                    <hr>

                    <button type="submit" class="btn btn-dark">Register</button>
                </form>
            </div>

        </div>
    </div>
</div>
